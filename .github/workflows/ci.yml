name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependências - pedidos
        run: cd pedidos && npm install

      - name: Install dependências - pagamentos
        run: cd pagamentos && npm install

      - name: Install dependências - estoque
        run: cd estoque && npm install

      - name: Install dependências - gateway
        run: cd gateway && npm install

      - name: Build Docker Compose
        run: docker compose build